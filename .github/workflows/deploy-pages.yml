# Publicação do protótipo no GitHub Pages.
#
# Portado do mutual-terminal-global e adaptado para ESTE repositório
# (MutualTecnologia/Mutual-Backoffice-Corporativo): o código fica na raiz, e a
# branch de publicação é a `main` — aqui não existe o protótipo Vite nem o
# portão que motivava a `mainv2` no repositório de origem.
#
# `GITHUB_PAGES=true` liga o `basePath`/`assetPrefix` de
# `/Mutual-Backoffice-Corporativo` em `next.config.mjs`, e `output: 'export'`
# grava o site em `out/`.
#
# O `.nojekyll` em `public/` é obrigatório e não é decorativo: o Pages roda
# Jekyll por padrão, e Jekyll ignora diretório que começa com underscore — o que
# incluiria `_next/`, ou seja, todo o JS e CSS do build. Sem ele o site sobe e
# abre em branco.
name: Publicar no Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Uma publicação por vez; um push novo não cancela a que já está subindo.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # ANTES do build, e não depois — depois do build, um build vermelho nunca
      # alcança esta etapa, e o site do Pages segue inexistente sem que o log
      # diga que foi por isso.
      #
      # ⛔ `enablement: true` NÃO substitui o ato humano quando o token do
      # workflow não tem administração do repositório. A etapa seguinte existe
      # para dizer isso em vez de deixar o erro cru.
      - name: Configurar Pages
        id: pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Diagnosticar Pages não habilitado
        if: failure() && steps.pages.outcome == 'failure'
        run: |
          echo "::error title=GitHub Pages não está habilitado::Habilitar o Pages exige direito de administração e não pode ser feito por workflow. Settings > Pages > Source: GitHub Actions."
          {
            echo "### GitHub Pages não está habilitado neste repositório"
            echo ""
            echo "Criar o site do Pages exige **direito de administração do repositório** —"
            echo "\`permissions: pages: write\` não supre isso."
            echo ""
            echo "**Ação (uma vez, por quem administra):** *Settings → Pages → Source: **GitHub Actions***."
          } >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: package-lock.json

      - run: npm ci

      - run: npm run build:pages

      - uses: actions/upload-pages-artifact@v3
        with:
          path: out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
